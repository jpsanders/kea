---
name: Bug report
description: A command that did not do what the manual says
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what it did, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The output, ideally with --json. Remove anything private from your brain first.
      render: text
  - type: input
    id: version
    attributes:
      label: kea, Python and operating system
      placeholder: kea 1.0.1, Python 3.15.2 on Ubuntu 26.04
    validations:
      required: true
