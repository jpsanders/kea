---
name: ci

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'
  # Run CI manually
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    uses: "./.github/workflows/python-checks.yml"
    with:
      python-version: "3.15"

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
    uses: "./.github/workflows/python-tests.yml"
    with:
      os: ${{ matrix.os }}
      python-version: "3.15"

  # Proves the built wheel installs on its own and works, with no source tree around it.
  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: "Build the wheel and the sdist"
        run: |
          python -m pip install build
          python -m build -o dist

      - name: "Install the wheel in a clean environment and use it"
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          export XDG_CONFIG_HOME=/tmp/config
          /tmp/clean/bin/kea --version
          /tmp/clean/bin/kea init /tmp/demo --example --no-git
          cd /tmp/demo
          /tmp/clean/bin/kea status
          /tmp/clean/bin/kea calibration --json
          /tmp/clean/bin/kea synth second-cafe
          /tmp/clean/bin/kea search wholesale --limit 1
          /tmp/clean/bin/kea check
          /tmp/clean/bin/kea guide | head -3
          /tmp/clean/bin/kea man --raw | head -1
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | /tmp/clean/bin/kea mcp | head -c 200
